# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 26.2 requires Java 25. The system PATH points at Java 8, so point
# Gradle at the JDK 25 install explicitly instead of changing PATH.
org.gradle.java.home=C:/Program Files/Java/jdk-25.0.4

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.1.0
maven_group=io.github.tsiw.bulkmine

# Dependencies
fabric_api_version=0.156.0+26.2
